    toc-depth: 3
    toc-title: "Sommaire"
    number-sections: false
    smooth-scroll: true
    code-fold: true
    code-tools: false
    code-copy: true
    highlight-style: github

execute:
  freeze: auto
  echo: true
  warning: false

lang: fr