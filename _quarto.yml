# Pied de page
page-footer:
    left: "© 2026 Johary - Ingénieur Hydraulicien"
    right: "Conception par Johary Ramorasata"

search: true

open_graph:
    title: "Johary - Ingénieur Hydraulicien"
    image: static/avatar.jpg
    locale: "fr_FR"

format:
    html:
        embed-resources: true
        theme:
            light: cosmo
            dark: darkly
        css: styles.css
        toc: true
        toc-depth: 3
        toc-title: "Sommaire"
        number-sections: false
        smooth-scroll: true
        code-fold: true
        code-tools: false
        code-copy: true
        highlight-style: github
        format:
        include-after-body:
          text: |
            <footer style="text-align:center; margin-top:2rem; font-size:0.85em; color:#888;">
              Copyright &copy; 2026 SmartHydro
            </footer>

execute:
    freeze: auto
    echo: true
    warning: false

lang: fr
