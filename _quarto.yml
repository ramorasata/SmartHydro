# Barre de navigation
navbar:
    left:
        - text: "Accueil"
          href: index.qmd
        - text: "Formation"
          href: formation/index.qmd
        - text: "Études de cas"
          href: etudes-de-cas/index.qmd
        - text: "Géomatique"
          href: geomatique/index.qmd
        - text: "Programmation"
